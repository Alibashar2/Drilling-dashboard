# Builds the dashboard and publishes it to GitHub Pages on every push to main (or on demand).
# The site is static: the database (PGlite) runs in each visitor's browser. No secrets are used or needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Unit tests (the real-report tests skip themselves: the reports are not in the repository)
      - run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # e.g. /Drilling-dashboard/ - all asset URLs are built under the repository path
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
